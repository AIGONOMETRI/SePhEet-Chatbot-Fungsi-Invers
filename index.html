 Tentukan f⁻¹(x).\nDi sini a = 2, b = 1, c = 1, d = −3, sehingga f⁻¹(x) = (3x + 1)/(x − 2), x ≠ 2.\n\nContoh 3. f(x) = 2^(x+1). Tentukan f⁻¹(x).\ny = 2^(x+1) → x + 1 = ²log y → f⁻¹(x) = ²log x − 1.\n\nContoh 4. f(x) = 2x + 3 dan g(x) = x − 1. Tentukan (f ∘ g)⁻¹(x).\nf⁻¹(x) = (x − 3)/2 dan g⁻¹(x) = x + 1.\n(f ∘ g)⁻¹(x) = g⁻¹(f⁻¹(x)) = (x − 3)/2 + 1 = (x − 1)/2.\n\nContoh 5. f(x) = 2x + 1. Tentukan f⁻¹(7).\nCari x yang membuat 2x + 1 = 7, yaitu x = 3. Jadi f⁻¹(7) = 3.\n\nada yang bisa SePhEet bantu lagi boss??","image":null},{"keywords":["halo sepheet"],"question":"halo Sepheet","category":"Konsep","response":"halo boss👋🏻👋🏻, ada yang bisa SePhEet bantu nihh🤔?????","image":null},{"keywords":["apakah kamu tahu tentang fungsi invers?"],"question":"apakah kamu tahu tentang fungsi invers?","category":"Konsep","response":"Yaaa jelas tau donggg😎😎 apa yang gak SePhEet gak tauu kalo buat boss SePhEet bakal jawabb😎😎😎","image":null},{"keywords":["berikan saya contoh latihan soal nya"],"question":"berikan saya contoh latihan soal nya","category":"Latihan","response":"oke boss👍👍 SePhEet bakal bantu aman aja, gak susah kok\n\n1. f(x) = 4x + 7. Tentukan f⁻¹(x).\n2. f(x) = (3x − 2)/(x + 4), x ≠ −4. Tentukan f⁻¹(x).\n3. f(x) = 3^(x−2). Tentukan f⁻¹(x).\n4. f(x) = ²log(x + 3). Tentukan f⁻¹(x).\n5. f(x) = 5x − 2. Tentukan f⁻¹(8).\n\nada yang bisa SePhEet bantu lagi bosss??","image":null},{"keywords":["sepheet berikan saya kesalahan yang kemungkinan terjadi dong saat mengerjakan soal fungsi invers"],"question":"sepheet berikan saya kesalahan yang kemungkinan terjadi dong saat mengerjakan soal fungsi invers","category":"Kesalahan Umum","response":"oke boss👍👍 SePhEet bakal bantu aman aja,ini dia kemungkinan kesalahan yang bakal terjadi \n\nMenyamakan f⁻¹(x) dengan 1/f(x). Notasi ⁻¹ di sini berarti invers, bukan pangkat negatif.\nLupa mengganti variabel akhir. Setelah mendapat x dalam y, hasilnya harus ditulis ulang dengan x sebagai variabel.\nSalah tanda pada rumus pecahan. Yang sering tertukar adalah tanda pada d dan a.\nLupa menuliskan syarat domain, misalnya x ≠ a/c pada fungsi pecahan.\nMembalik urutan pada invers komposisi. (f ∘ g)⁻¹ = g⁻¹ ∘ f⁻¹, bukan f⁻¹ ∘ g⁻¹.\nMencari invers fungsi kuadrat tanpa membatasi domain. Fungsi kuadrat tidak satu-satu, jadi baru punya invers jika domainnya dibatasi.\nTertukar antara logaritma dan eksponen. Ingat aˣ ↔ ᵃlog x.\nSalah membalik operasi. Saat memindahkan ruas, urutan operasi harus dibalik (misalnya 3x − 5: tambah 5 dulu, baru bagi 3).\n\nada yang bisa SePhEet bantu lagi boss??","image":null},{"keywords":["udah ini aja sepheet trimakasih yaa"],"question":"udah ini aja Sepheet trimakasih yaa","category":"Konsep","response":"oke boss👍👍 aman aja","image":null}];


function normalizeText(text) {

    return text

        .toLowerCase()

        .trim()

        .replace(/\s+/g, " ");

}


function findResponse(input) {

    const normalized =
        normalizeText(input);


    let bestRule = null;

    let bestScore = 0;


    rules.forEach(rule => {

        let score = 0;


        rule.keywords.forEach(keyword => {

            const key =
                normalizeText(keyword);


            if (
                normalized.includes(key)
            ) {

                score += key.length;

            }

        });


        if (score > bestScore) {

            bestScore = score;

            bestRule = rule;

        }

    });


    if (bestRule) {

        return bestRule;

    }


    return {

        response:
            "Maaf, saya belum memahami pertanyaan tersebut. Coba gunakan kata kunci lain atau tanyakan dengan cara berbeda.",

        image: null

    };

}


function addMessage(
    type,
    text,
    image
) {

    const chatbox =
        document.getElementById("chatbox");

    const chat =
        document.createElement("div");

    chat.className =
        "chat " + type;

    if (type === "incoming") {

        chat.innerHTML = `
            <div class="bot-icon">
                <i class='bx bx-bot'></i>
            </div>

            <div class="message"></div>
        `;

    } else {

        chat.innerHTML = `
            <div class="message"></div>
        `;

    }

    const message =
        chat.querySelector(".message");

    if (text) {

        const paragraph =
            document.createElement("p");

        paragraph.textContent =
            text;

        message.appendChild(paragraph);

    }

    if (image && image.dataUrl) {

        const imageElement =
            document.createElement("img");

        imageElement.src =
            image.dataUrl;

        imageElement.alt =
            image.name || "Gambar respons chatbot";

        imageElement.loading =
            "lazy";

        message.appendChild(imageElement);

    }

    chatbox.appendChild(chat);

    chatbox.scrollTop =
        chatbox.scrollHeight;

    if (
        window.MathJax &&
        MathJax.typesetPromise
    ) {

        MathJax.typesetPromise([
            chat
        ]);

    }

}



function sendMessage() {

    const input =
        document.getElementById("input");


    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    addMessage(
        "outgoing",
        text
    );


    input.value = "";


    setTimeout(() => {

        const response =
            findResponse(text);


        addMessage(
            "incoming",
            response.response || "",
            response.image || null
        );

    }, 350);

}


document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );
